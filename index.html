<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // tema pelo horário: escuro das 18h às 07h (aplicado antes de desenhar a tela)
    (function () {
      var t = 'auto'; try { t = localStorage.getItem('agenda-tema') || 'auto'; } catch (e) {}
      var h = new Date().getHours();
      if (t === 'escuro' || (t === 'auto' && (h >= 18 || h < 7))) document.documentElement.classList.add('escuro');
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=24">
  <title>Minha Agenda</title>
</head>
<body>

  <!-- LOGIN -->
  <section id="tela-login" class="login" hidden>
    <div class="login-card">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1>Minha Agenda</h1>
      <p class="muted">Entre para ver suas tarefas no celular e no PC.</p>
      <form id="form-login">
        <label>E-mail
          <input type="email" id="login-email" required autocomplete="email">
        </label>
        <label>Senha
          <input type="password" id="login-senha" required minlength="6" autocomplete="current-password">
        </label>
        <button type="submit" class="btn primario">Entrar</button>
        <button type="button" id="btn-criar-conta" class="btn texto">Criar minha conta</button>
        <p id="login-msg" class="msg"></p>
        <p class="versao-app"></p>
      </form>
    </div>
  </section>

  <!-- APP -->
  <section id="tela-app" hidden>
    <header class="topo">
      <div class="topo-linha">
        <div>
          <p id="saudacao" class="saudacao">Olá</p>
          <h1 id="data-hoje">Minha Agenda</h1>
        </div>
        <div class="topo-acoes">
          <button id="btn-busca" class="icone-btn" aria-label="Pesquisar"><i data-ic="search"></i></button>
          <button id="btn-menu" class="icone-btn" aria-label="Mais opções"><i data-ic="more"></i></button>
        </div>
      </div>
      <div id="resumo" class="resumo"></div>
    </header>

    <div id="barra-busca" class="barra-busca" hidden>
      <i data-ic="search" class="lupa"></i>
      <input id="busca-global" type="search" placeholder="Pesquisar tarefas e notas" autocomplete="off" enterkeyhint="search">
      <button type="button" id="busca-fechar" class="icone-btn" aria-label="Fechar"><i data-ic="x"></i></button>
    </div>

    <nav class="abas">
      <button data-aba="hoje" class="ativa"><i data-ic="hoje"></i><span>Hoje</span></button>
      <button data-aba="todas"><i data-ic="lista"></i><span>Todas</span></button>
      <button data-aba="notas"><i data-ic="nota"></i><span>Notas</span></button>
      <button data-aba="concluidas"><i data-ic="feito"></i><span>Feitas</span></button>
    </nav>

    <div id="busca-wrap" class="busca-wrap" hidden>
      <input id="busca" type="search" placeholder="Buscar tarefa ou quem pediu">
    </div>

    <main id="lista" class="lista"></main>
    <p class="versao-app"></p>
    <section id="notas" class="notas" hidden></section>

    <button id="fab-voz" class="fab-voz" aria-label="Criar tarefa falando"><i data-ic="mic"></i></button>
    <button id="fab" class="fab" aria-label="Nova tarefa"><i data-ic="mais"></i></button>
  </section>

  <!-- NOVA / EDITAR TAREFA -->
  <dialog id="dlg-tarefa" class="sheet sheet-tarefa">
    <form id="form-tarefa">
      <div class="alca" tabindex="-1" autofocus></div>
      <div class="sheet-cab">
        <h2 id="dlg-titulo">Nova tarefa</h2>
        <button type="button" id="btn-cancelar" class="icone-btn" aria-label="Fechar"><i data-ic="x"></i></button>
      </div>

      <div class="titulo-voz">
        <textarea id="f-titulo" required rows="1" autocomplete="off" placeholder="O que precisa fazer?" enterkeyhint="done"></textarea>
        <button type="button" id="btn-voz" class="btn-voz" aria-label="Falar"><i data-ic="mic"></i></button>
      </div>
      <p id="voz-status" class="voz-status" hidden></p>

      <div class="campo-form" id="linha-prazo">
        <p class="rot">Prazo</p>
        <div class="segmento" id="chips-prazo">
          <button type="button" data-prazo="hoje">Hoje</button>
          <button type="button" data-prazo="amanha">Amanhã</button>
          <button type="button" data-prazo="data">Outra data</button>
          <button type="button" data-prazo="">Sem prazo</button>
        </div>
        <input type="date" id="f-prazo" hidden>
      </div>

      <div class="campo-form" id="linha-lembrar">
        <p class="rot">Me lembrar</p>
        <div class="opcoes" id="chips-lembrar">
          <button type="button" data-lembrar="">Não</button>
          <button type="button" data-lembrar="15min">Em 15 min</button>
          <button type="button" data-lembrar="1h">Em 1 hora</button>
          <button type="button" data-lembrar="3h">Em 3 horas</button>
          <button type="button" data-lembrar="amanha-0630">Amanhã 06:30</button>
          <button type="button" data-lembrar="outro">Outro horário</button>
        </div>
        <input type="datetime-local" id="f-lembrar" hidden>
        <div id="bloco-aviso" hidden>
          <div class="segmento" id="chips-aviso">
            <button type="button" data-aviso="alarme"><i data-ic="alarme"></i>Alarme</button>
            <button type="button" data-aviso="notificacao"><i data-ic="sino"></i>Só notificação</button>
          </div>
          <p class="dica" id="dica-aviso"></p>
        </div>
      </div>

      <div class="campo-form">
        <p class="rot">Quem pediu</p>
        <input id="f-quem" autocomplete="off" placeholder="Nome (opcional)">
        <div class="opcoes" id="sugestoes-quem"></div>
      </div>

      <div class="campo-form">
        <p class="rot">Repetir</p>
        <div class="segmento" id="chips-repetir">
          <button type="button" data-rep="">Não repete</button>
          <button type="button" data-rep="mensal">Todo mês</button>
          <button type="button" data-rep="semanal">Toda semana</button>
        </div>
        <div id="campos-recorrencia" class="caixa-rec" hidden>
          <div class="linha-2">
            <label id="lbl-dia-mes">Dia do mês
              <input type="number" id="f-dia-mes" min="1" max="31" value="15" inputmode="numeric">
            </label>
            <label id="lbl-dia-semana" hidden>Dia da semana
              <select id="f-dia-semana">
                <option value="1">Segunda</option><option value="2">Terça</option><option value="3">Quarta</option>
                <option value="4">Quinta</option><option value="5">Sexta</option><option value="6">Sábado</option><option value="0">Domingo</option>
              </select>
            </label>
            <label>Avisar dias antes
              <input type="number" id="f-dias-antes" min="0" max="31" value="5" inputmode="numeric">
            </label>
          </div>
          <label>Horário do aviso
            <input type="time" id="f-hora-aviso" value="08:00">
          </label>
          <p class="dica" id="dica-rec"></p>
        </div>
      </div>

      <div class="campo-form" id="linha-status" hidden>
        <p class="rot">Status</p>
        <div class="opcoes" id="opcoes-status"></div>
        <select id="f-status" hidden></select>
      </div>

      <div class="campo-form" id="linha-notas" hidden>
        <p class="rot">Anotações / onde parei</p>
        <textarea id="f-notas" rows="2" placeholder="Ex.: falta conferir o turno 3"></textarea>
      </div>

      <div class="rodape">
        <button type="button" id="btn-excluir" class="icone-btn perigo" hidden aria-label="Excluir"><i data-ic="lixo"></i></button>
        <span class="esp"></span>
        <button type="submit" id="btn-salvar" class="btn primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- AÇÕES DA TAREFA (toque na tarefa) -->
  <dialog id="dlg-acoes" class="sheet sheet-acoes">
    <div class="acoes-corpo">
      <div class="alca" tabindex="-1" autofocus></div>
      <h3 id="acoes-titulo"></h3>
      <div id="acoes-meta" class="linha-meta"></div>
      <div id="acoes-lista" class="acoes-lista"></div>
    </div>
  </dialog>

  <!-- PAUSAR -->
  <dialog id="dlg-pausa" class="sheet">
    <form id="form-pausa">
      <div class="alca" tabindex="-1" autofocus></div>
      <h2>Pausar tarefa</h2>
      <p class="muted" id="pausa-nome"></p>
      <label>Onde você parou? (pra retomar rápido depois)
        <textarea id="p-notas" rows="3" placeholder="Ex.: falta só conferir o turno 3 e mandar o e-mail"></textarea>
      </label>
      <div class="rodape">
        <span class="esp"></span>
        <button type="button" id="btn-pausa-cancelar" class="btn texto">Cancelar</button>
        <button type="submit" class="btn primario">Pausar</button>
      </div>
    </form>
  </dialog>

  <!-- NOTA (celular) -->
  <dialog id="dlg-nota" class="sheet">
    <form id="form-nota">
      <div class="alca" tabindex="-1" autofocus></div>
      <input id="n-titulo" class="n-titulo" placeholder="Título" autocomplete="off">
      <div class="editor-barra">
        <button type="button" class="btn-b" data-cmd="bold"><b>B</b></button>
        <span class="editor-dica">Selecione um trecho e toque em B para negrito</span>
      </div>
      <div id="n-texto" class="n-texto" contenteditable="true" data-placeholder="Escreva sua nota..."></div>
      <div class="campo">
        <span class="rotulo">Destaque</span>
        <div class="chips" id="n-destaque">
          <button type="button" data-destaque="">Normal</button>
          <button type="button" data-destaque="importante">⭐ Importante</button>
          <button type="button" data-destaque="urgente">🔴 Urgente</button>
        </div>
      </div>
      <div class="campo">
        <span class="rotulo">Cor</span>
        <div class="chips cores-nota" id="n-cores"></div>
      </div>
      <div class="rodape">
        <button type="button" id="btn-nota-excluir" class="btn perigo">Excluir</button>
        <span class="esp"></span>
        <button type="button" id="btn-nota-fechar" class="btn texto">Cancelar</button>
        <button type="submit" class="btn primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- MENU ⋯ -->
  <dialog id="dlg-menu" class="sheet menu">
    <div class="menu-corpo">
      <div class="alca" tabindex="-1" autofocus></div>
      <p class="menu-titulo">Tema</p>
      <div class="chips" id="chips-tema">
        <button type="button" data-tema="auto">🌗 Automático <small>(claro 07h–18h)</small></button>
        <button type="button" data-tema="claro">☀️ Sempre claro</button>
        <button type="button" data-tema="escuro">🌙 Sempre escuro</button>
      </div>
      <p class="menu-titulo">Lembretes neste aparelho</p>
      <div id="menu-notif" class="menu-notif"></div>
      <div id="menu-nativo" hidden>
        <button type="button" id="menu-som" class="menu-item">🎵 Som do alarme: <b id="nome-som">…</b></button>
        <button type="button" id="menu-som-notif" class="menu-item">🔔 Som da notificação</button>
        <button type="button" id="menu-atualizar" class="menu-item">⬇️ Procurar atualização <small id="versao-nativa"></small></button>
      </div>
      <button type="button" id="menu-sair" class="menu-item perigo-txt">Sair da conta</button>
      <button type="button" id="menu-fechar" class="menu-item">Fechar</button>
    </div>
  </dialog>

  <!-- ALARME DENTRO DO APP -->
  <dialog id="dlg-alarme" class="alarme">
    <div class="alca-vazia" tabindex="-1" autofocus></div>
    <div class="alarme-icone">⏰</div>
    <p class="alarme-rotulo">Lembrete</p>
    <h2 id="alarme-titulo"></h2>
    <p id="alarme-info" class="alarme-info"></p>
    <div class="alarme-botoes">
      <button type="button" id="alarme-adiar" class="btn primario">Adiar 10 min</button>
      <button type="button" id="alarme-concluir" class="btn ok-btn">✓ Concluir</button>
      <button type="button" id="alarme-parar" class="btn texto">Parar alarme</button>
    </div>
  </dialog>

  <!-- CONFIRMAÇÃO -->
  <dialog id="dlg-confirma" class="confirma">
    <div class="alca-vazia" tabindex="-1" autofocus></div>
    <p id="confirma-msg"></p>
    <div class="confirma-botoes">
      <button type="button" id="confirma-cancelar" class="btn texto">Cancelar</button>
      <button type="button" id="confirma-ok" class="btn primario">Confirmar</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden><span id="toast-msg"></span><button type="button" id="toast-acao" hidden></button></div>

  <script type="module" src="app.js?v=24"></script>
</body>
</html>
